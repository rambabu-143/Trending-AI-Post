name: Daily trending repo post

on:
  schedule:
    - cron: "30 3 * * 1-5" # 9:00 AM IST, Mon-Fri only (weekend B2B reach is cut 30-50%)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.2

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          for i in $(seq 1 30); do curl -s http://localhost:11434 >/dev/null && break; sleep 1; done
          ollama pull llama3.2

      - name: Run bot
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: uv run post-trending

      - name: Commit updated posted_repos.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_repos.txt
          git diff --staged --quiet || git commit -m "Mark repo as posted [skip ci]"
          git push
